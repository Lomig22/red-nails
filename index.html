<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kit 30 faux ongles en gel souple | RED NAILS</title>
  <meta name="description" content="30 faux ongles en gel souple, forme amande, effet laqué. Pose en 10 minutes, réutilisables. 24,99 € le kit, soit 0,83 € l'ongle.">
  <meta name="theme-color" content="#C8102E">
  <link rel="canonical" href="https://red-nails.fr/">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="RED NAILS">
  <meta property="og:title" content="Kit 30 faux ongles en gel souple | RED NAILS">
  <meta property="og:description" content="Pose en 10 minutes. 0,83 € l'ongle au lieu de 40 € la pose en institut.">
  <meta property="og:url" content="https://red-nails.fr/">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Polices : chargement non bloquant (performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Unbounded:wght@600..800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Unbounded:wght@600..800&display=swap"></noscript>

  <link rel="preload" as="image" href="images/bordeaux/main.webp" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#produit">Aller au produit</a>

  <!-- ==================================================================
       1. BANDEAU PROMO DÉFILANT
       ================================================================== -->
  <div class="announce" role="region" aria-label="Offres en cours">
    <p class="sr-only" data-render="announce-sr"></p>
    <div class="announce__track" aria-hidden="true" data-render="announce"></div>
  </div>

  <!-- ==================================================================
       2. HEADER
       ================================================================== -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="#produit" aria-label="RED NAILS, retour au produit">
        <span class="logo__red">RED</span> NAILS
      </a>
      <button class="cart-btn" type="button" data-open-cart aria-label="Ouvrir le panier, 0 article">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
        <span class="cart-btn__count" data-cart-count>0</span>
      </button>
    </div>
  </header>

  <main>
    <!-- ================================================================
         3. FICHE PRODUIT
         ================================================================ -->
    <section id="produit" class="product" aria-labelledby="product-title">
      <!-- Galerie -->
      <div class="product__gallery enter" style="--i:0">
        <div class="gallery is-first">
          <div class="gallery__viewport" id="gallery-viewport" tabindex="0"
               role="region" aria-roledescription="carrousel" aria-label="Photos du produit">
            <div class="gallery__track" data-render="slides">
              <!-- 1re image en dur pour un affichage immédiat (LCP) ; app.js régénère la galerie -->
              <div class="gallery__slide"><img src="images/bordeaux/main.webp" alt="Faux ongles Bordeaux en forme amande posés sur des mains" width="800" height="800" fetchpriority="high" decoding="async"></div>
            </div>
          </div>
          <span class="gallery__count" aria-hidden="true" data-gallery-count>1 / 5</span>
          <span class="gallery__hint" aria-hidden="true" data-gallery-hint>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>
            <span data-gallery-hint-text></span>
          </span>
        </div>
        <div class="gallery__thumbs" data-render="thumbs" aria-label="Choisir une photo"></div>
      </div>

      <!-- Infos -->
      <div class="product__info">
        <p class="kicker enter" style="--i:1" data-t="PRODUCT.kicker"></p>
        <h1 id="product-title" class="product__title enter" style="--i:2" data-t="PRODUCT.title"></h1>
        <ul class="promises enter" style="--i:3" data-render="promises"></ul>

        <!-- Prix : élément le plus visible de la page -->
        <div class="price-box enter" style="--i:4" aria-live="polite">
          <div class="price-box__row">
            <span class="price-now" data-price-now></span>
            <s class="price-was" data-price-was hidden></s>
            <span class="price-badge" data-price-badge hidden></span>
          </div>
          <p class="per-nail">
            <span class="per-nail__pre" data-t="TEXTS.product.perNailPrefix"></span>
            <strong class="per-nail__val" data-per-nail></strong>
            <span class="per-nail__suf" data-t="TEXTS.product.perNailSuffix"></span>
          </p>
        </div>
        <p class="salon-line enter" style="--i:5" data-salon-line></p>

        <!-- Sélecteur de couleur -->
        <fieldset class="field enter" style="--i:6">
          <legend class="field__legend">
            <span data-t="TEXTS.product.colorLegend"></span>
            <strong data-color-name></strong>
          </legend>
          <div class="swatches" data-render="swatches"></div>
        </fieldset>

        <!-- Sélecteur de lots -->
        <fieldset class="field enter" id="offres" style="--i:7">
          <legend class="field__legend"><span data-t="TEXTS.product.bundleLegend"></span></legend>
          <div class="bundles" data-render="bundles"></div>
        </fieldset>

        <p class="ship-line enter" style="--i:8" data-ship-line></p>

        <!-- CTA principal -->
        <button class="btn btn--primary btn--xl enter" style="--i:9" id="main-cta" type="button" data-add-current>
          <span class="btn__dot" data-color-dot aria-hidden="true"></span>
          <span data-add-label></span>
        </button>

        <!-- Promesse de livraison -->
        <div class="eta enter" style="--i:10">
          <p class="eta__text" data-eta-text></p>
          <ol class="eta__steps" data-eta-steps></ol>
        </div>

        <!-- Réassurance -->
        <ul class="reassure enter" style="--i:11" data-render="reassurance"></ul>
      </div>
    </section>

    <!-- CTA répété n°1 (après le hero) -->
    <div class="cta-band" data-render="cta"></div>

    <!-- ================================================================
         4. LE CALCUL EST VITE FAIT
         ================================================================ -->
    <section id="calcul" class="section section--dark reveal" aria-labelledby="compare-title">
      <div class="container">
        <p class="eyebrow eyebrow--light" data-t="TEXTS.compare.eyebrow"></p>
        <h2 id="compare-title" class="section__title" data-t="TEXTS.compare.title"></h2>
        <div class="compare">
          <div class="compare__card compare__card--salon">
            <p class="compare__label" data-t="TEXTS.compare.salonLabel"></p>
            <p class="compare__value" data-t="TEXTS.compare.salonValue"></p>
            <p class="compare__unit" data-t="TEXTS.compare.salonUnit"></p>
          </div>
          <span class="compare__vs" aria-hidden="true">VS</span>
          <div class="compare__card compare__card--ours">
            <p class="compare__label" data-t="TEXTS.compare.ourLabel"></p>
            <p class="compare__value"><span data-counter></span></p>
            <p class="compare__unit" data-t="TEXTS.compare.ourUnit"></p>
          </div>
        </div>
        <p class="compare__line" data-t="TEXTS.compare.line"></p>
        <div class="bars" aria-hidden="true">
          <p class="bars__title" data-t="TEXTS.compare.barsTitle"></p>
          <div class="bars__row"><span class="bars__label" data-t="TEXTS.compare.barSalon"></span><span class="bars__bar bars__bar--salon" data-bar="salon"></span><span class="bars__val" data-bar-val="salon"></span></div>
          <div class="bars__row"><span class="bars__label" data-t="TEXTS.compare.barOurs"></span><span class="bars__bar bars__bar--ours" data-bar="ours"></span><span class="bars__val" data-bar-val="ours"></span></div>
        </div>
        <p class="compare__foot" data-t="TEXTS.compare.footnote"></p>
      </div>
    </section>

    <!-- CTA répété n°2 (après la comparaison institut) -->
    <div class="cta-band" data-render="cta"></div>

    <!-- ================================================================
         5. COMMENT ÇA MARCHE
         ================================================================ -->
    <section id="comment" class="section reveal" aria-labelledby="steps-title">
      <div class="container">
        <p class="eyebrow" data-t="TEXTS.steps.eyebrow"></p>
        <h2 id="steps-title" class="section__title" data-t="TEXTS.steps.title"></h2>
        <ol class="steps" data-render="steps"></ol>
      </div>
    </section>

    <!-- ================================================================
         6. CHOISIS TA COULEUR
         ================================================================ -->
    <section id="couleurs" class="section section--tint reveal" aria-labelledby="colors-title">
      <div class="container">
        <p class="eyebrow" data-t="TEXTS.colors.eyebrow"></p>
        <h2 id="colors-title" class="section__title" data-t="TEXTS.colors.title"></h2>
        <p class="section__intro" data-t="TEXTS.colors.intro"></p>
        <ul class="color-grid" data-render="color-cards"></ul>
      </div>
    </section>

    <!-- CTA répété n°3 (après les couleurs) -->
    <div class="cta-band" data-render="cta"></div>

    <!-- ================================================================
         7. CE QUE CONTIENT TON KIT
         ================================================================ -->
    <section id="kit" class="section reveal" aria-labelledby="kit-title">
      <div class="container kit">
        <div class="kit__media shine">
          <img data-kit-img src="images/bordeaux/contenu-kit.webp" alt="" width="800" height="800" loading="lazy" decoding="async">
        </div>
        <div>
          <p class="eyebrow" data-t="TEXTS.kit.eyebrow"></p>
          <h2 id="kit-title" class="section__title" data-t="TEXTS.kit.title"></h2>
          <ul class="checklist" data-render="kit"></ul>
        </div>
      </div>
    </section>

    <!-- ================================================================
         8. AVIS CLIENTS — section prévue, volontairement VIDE.
         Aucun avis, aucune note, aucun nombre de clientes n'est inventé.
         Pour l'activer : RN_CONFIG.REVIEWS.visible = true dans config.js.

         BRANCHER UN MODULE D'AVIS VÉRIFIÉS ICI :
         - Judge.me (Shopify) : remplacer le contenu de #reviews-widget par
             <div class="jdgm-widget jdgm-review-widget" data-id="{{ product.id }}"></div>
         - Loox (Shopify) : remplacer par
             <div id="looxReviews" data-product-id="{{ product.id }}"></div>
         (ou le bloc d'application correspondant dans l'éditeur de thème)
         ================================================================ -->
    <section id="avis" class="section section--tint" aria-labelledby="reviews-title" hidden>
      <div class="container">
        <h2 id="reviews-title" class="section__title" data-t="REVIEWS.title"></h2>
        <div id="reviews-widget"><!-- Widget d'avis vérifiés --></div>
      </div>
    </section>

    <!-- ================================================================
         9. FAQ
         ================================================================ -->
    <section id="faq" class="section reveal" aria-labelledby="faq-title">
      <div class="container container--narrow">
        <p class="eyebrow" data-t="TEXTS.faq.eyebrow"></p>
        <h2 id="faq-title" class="section__title" data-t="TEXTS.faq.title"></h2>
        <div class="faq" data-render="faq"></div>
      </div>
    </section>

    <!-- ================================================================
         10. CTA FINAL (CTA répété n°4, après la FAQ)
         ================================================================ -->
    <section class="final" aria-labelledby="final-title">
      <div class="container final__inner">
        <h2 id="final-title" class="final__title" data-t="TEXTS.final.title"></h2>
        <p class="final__text" data-t="TEXTS.final.text"></p>
        <div class="cta-band cta-band--inverse" data-render="cta"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="logo logo--light"><span class="logo__red">RED</span> NAILS</p>
      <p class="footer__tagline" data-t="TEXTS.footer.tagline"></p>
      <nav aria-label="Informations légales"><ul class="footer__links" data-render="footer-links"></ul></nav>
      <p class="footer__copy" data-footer-copy></p>
    </div>
  </footer>

  <!-- Barre d'achat collante (mobile) -->
  <div class="sticky-buy" data-sticky aria-hidden="true" inert>
    <img class="sticky-buy__thumb" data-sticky-thumb src="images/bordeaux/main.webp" alt="" width="48" height="48">
    <div class="sticky-buy__info">
      <span class="sticky-buy__name" data-sticky-name></span>
      <span class="sticky-buy__price" data-sticky-price></span>
    </div>
    <button class="btn btn--primary sticky-buy__btn" type="button" data-add-current data-t="TEXTS.product.stickyAdd"></button>
  </div>

  <!-- Tiroir panier (démo) -->
  <dialog class="drawer" id="cart" aria-labelledby="cart-title">
    <div class="drawer__panel">
      <div class="drawer__head">
        <h2 id="cart-title" class="drawer__title" data-t="TEXTS.cart.title"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Fermer le panier">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="drawer__body" data-cart-body></div>
      <div class="drawer__foot" data-cart-foot></div>
    </div>
  </dialog>

  <!-- Pop-up promo -->
  <dialog class="popup" id="promo" aria-labelledby="promo-title">
    <div class="popup__panel">
      <button class="icon-btn popup__close" type="button" data-close aria-label="Fermer">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <p class="eyebrow" data-t="POPUP.eyebrow"></p>
      <h2 id="promo-title" class="popup__title" data-t="POPUP.title"></h2>
      <p class="popup__text" data-t="POPUP.text"></p>
      <div class="popup__code">
        <code data-t="POPUP.code"></code>
        <button class="btn btn--ghost" type="button" data-copy-code><span data-t="POPUP.copyLabel"></span></button>
      </div>
      <button class="btn btn--primary btn--block" type="button" data-popup-cta><span data-t="POPUP.cta"></span></button>
      <button class="link-btn" type="button" data-close><span data-t="POPUP.dismiss"></span></button>
    </div>
  </dialog>

  <!-- Annonces pour lecteurs d'écran -->
  <div class="sr-only" aria-live="polite" data-live></div>

  <noscript><p class="noscript">Active JavaScript pour commander sur red-nails.fr.</p></noscript>
</body>
</html>
